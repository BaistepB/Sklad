        ];

        const EditItemModal = ({ editingItem, theme, manufacturers, onSave, onClose }) => {

                    return (dark || light)

                        .replace(/bg-\[#282B30\]/g, 'bg-[#11261D]')
                        .replace(/bg-\[#1E2125\]/g, 'bg-[#0D1F17]')
                        .replace(/hover:bg-\[#33363B\]/g, 'hover:bg-[#19382B]')
                        // Рамки карточек и разделители -> хвойно-золотистые
                        .replace(/border-\[#3A3D42\]/g, 'border-[#1E3F30]')
                        .replace(/border-gray-800/g, 'border-[#1A382A]')
                        .replace(/border-gray-700/g, 'border-[#234736]')
                        .replace(/border-\[#444\]/g, 'border-[#234736]')
                        // Главные акцентные кнопки -> праздничный рубиново-красный с золотистой тенью
                        .replace(/bg-\[#FFB300\] text-black/g, 'bg-gradient-to-r from-[#B71C1C] to-[#D32F2F] text-white border border-[#FBBF24]/40')
                        .replace(/hover:bg-\[#FFA000\]/g, 'hover:from-[#9A1B24] hover:to-[#B71C1C]')
                        .replace(/bg-\[#FFB300\]\/20/g, 'bg-[#FBBF24]/20')
                        .replace(/bg-\[#FFB300\]\/15/g, 'bg-[#FBBF24]/15')
                        .replace(/bg-\[#FFB300\]/g, 'bg-[#C62828] text-white')
                        // Акцентный текст (артикулы, активные табы, заголовки) -> искристое золото
                        .replace(/text-\[#FFB300\]/g, 'text-[#FBBF24]')
                        // Золотые рамки и кольца фокуса
                        .replace(/border-\[#FFB300\]\/50/g, 'border-[#FBBF24]/50')
                        .replace(/border-\[#FFB300\]/g, 'border-[#FBBF24]')
                        .replace(/focus:ring-\[#FFB300\]/g, 'focus:ring-[#FBBF24]')
                        .replace(/shadow-\[#FFB300\]\/\d+/g, 'shadow-[#C62828]/40');
                }
                if (theme === 'expert') {
                    if (expert) return expert;
                    return (light || dark)
                        // Фон серый для подложек
                        .replace(/bg-gray-100/g, 'bg-[#F4F5F7]')
                        // Все насыщенные и темные янтарные заливки меняем на фирменный красный
                        .replace(/bg-amber-(400|500|600|700|800|900|950)/g, 'bg-[#C62828]')
                        .replace(/bg-\[#FFB300\]\/15/g, 'bg-[#FCE8E8]')
                        .replace(/bg-\[#FFB300\]/g, 'bg-[#C62828]')
                        // Наведение на кнопки
                        .replace(/hover:bg-amber-(500|600|700|800|900|950)/g, 'hover:bg-[#B71C1C]')
                        // Полупрозрачный текст подписей
                        .replace(/text-amber-\d+\/(40|50|60|70)/g, 'text-gray-500')
                        // Все акцентные янтарные тексты меняем на темный бордовый
                        .replace(/text-amber-(400|500|600|700|800|900|950)/g, 'text-[#9A1B24]')
                        .replace(/text-\[#FFB300\]/g, 'text-[#9A1B24]')
                        // Рамки и кольца фокуса
                        .replace(/border-amber-(500|600|700|800|900|950)/g, 'border-[#C62828]')
                        .replace(/border-\[#FFB300\](\/50)?/g, 'border-[#C62828]')
                        .replace(/focus:ring-amber-\d+/g, 'focus:ring-[#C62828]')
                        .replace(/focus:border-amber-\d+/g, 'focus:border-[#C62828]')
                        .replace(/shadow-amber-\d+\/\d+/g, 'shadow-[#C62828]/30');
                }
                if (theme === 'expert-dark') {
                    if (dark && dark.includes('bg-[#FFB300]/15')) return dark;
                    return (dark || light)
                        // Заливки главных кнопок и бейджей -> фирменный красный с белым текстом
                        .replace(/bg-\[#FFB300\] text-black/g, 'bg-[#C62828] text-white')
                        .replace(/bg-\[#FFB300\]\/20/g, 'bg-[#C62828]/25')
                        .replace(/bg-\[#FFB300\]/g, 'bg-[#C62828]')
                        .replace(/hover:bg-\[#FFA000\]/g, 'hover:bg-[#B71C1C]')
                        // Акцентный текст (заголовки, активные вкладки, артикулы) -> светлый рубиново-коралловый для высокой контрастности на темном фоне
                        .replace(/text-\[#FFB300\]/g, 'text-[#FF5252]')
                        // Рамки и кольца фокуса -> рубиновые
                        .replace(/border-\[#FFB300\]\/50/g, 'border-[#EF4444]/50')
                        .replace(/border-\[#FFB300\]\/30/g, 'border-[#EF4444]/30')
                        .replace(/border-\[#FFB300\]/g, 'border-[#C62828]')
                        .replace(/focus:ring-\[#FFB300\]/g, 'focus:ring-[#EF4444]')
                        .replace(/shadow-\[#FFB300\]\/\d+/g, 'shadow-[#C62828]/30');
                }
                if (theme === 'marine') {
                    return (marine || dark)
                        .replace(/bg-blue-50\/50/g, 'bg-[#131D31]')
                        .replace(/bg-blue-50/g, 'bg-[#0B132B]')
                        .replace(/bg-blue-100/g, 'bg-[#162238]')
                        .replace(/bg-blue-200/g, 'bg-[#1E3A5F]')
                        .replace(/bg-white/g, 'bg-[#162032] text-blue-50')
                        .replace(/text-blue-950/g, 'text-blue-50')
                        .replace(/text-blue-900\/60/g, 'text-blue-300/50')
                        .replace(/text-blue-900/g, 'text-blue-100')
                        .replace(/text-blue-800/g, 'text-blue-200')
                        .replace(/text-blue-700/g, 'text-sky-400')
                        .replace(/text-blue-600/g, 'text-sky-400')
                        .replace(/border-blue-200/g, 'border-[#253652]')
                        .replace(/border-blue-300/g, 'border-sky-500/50');
                }
                if (theme === 'coffee') {
                    return (coffee || dark)
                        .replace(/bg-\[#F5F2EE\]/g, 'bg-[#16110F]')
                        .replace(/bg-\[#EFEBE9\]/g, 'bg-[#221A17]')
                        .replace(/bg-\[#FDFBF7\]/g, 'bg-[#241C19] text-[#F5EBE6]')
                        .replace(/bg-\[#D7CCC8\]\/60/g, 'bg-[#362924]')
                        .replace(/bg-\[#D7CCC8\]\/40/g, 'bg-[#362924]')

                        .replace(/bg-white/g, 'bg-[#241C19] text-[#F5EBE6]')
                        .replace(/text-\[#3E2723\]/g, 'text-[#F5EBE6]')
                        .replace(/text-\[#4E342E\]/g, 'text-[#E6D5CC]')
                        .replace(/text-\[#5D4037\]/g, 'text-[#D7B399]')
                        .replace(/text-\[#6D4C41\]\/60/g, 'text-[#A1887F]/60')
                        .replace(/text-\[#6D4C41\]/g, 'text-[#E0B084]')
                        .replace(/text-\[#8D6E63\]/g, 'text-[#D7B399]')
                        .replace(/border-\[#D7CCC8\]/g, 'border-[#3E2F2A]')
                        .replace(/border-\[#A1887F\]/g, 'border-[#6D4C41]');
                }
                if (theme === 'mint') return mint;
                if (theme === 'pink') return pink;
                if (theme === 'light') return light;
                return dark;
            };

            const [form, setForm] = useState({
                id: editingItem?.id || '',
                name: editingItem?.name || '',

                manufacturer: editingItem?.manufacturer || 'Мое',
                category: editingItem?.category || 'Основное'
            });
            const [errorMsg, setErrorMsg] = useState('');
            const [emptyFields, setEmptyFields] = useState({ id: false, name: false });

            const handleSave = () => {
                const trimmedId = form.id?.trim() || '';
                const trimmedName = form.name?.trim() || '';
                
                const missingId = !trimmedId;
                const missingName = !trimmedName;
                
                setEmptyFields({ id: missingId, name: missingName });

                if (missingId || missingName) {
                    setErrorMsg('Пожалуйста, заполните обязательные поля');
                    return;
                }
                
                setErrorMsg('');
                onSave({ ...form, id: trimmedId, name: trimmedName });

            return (

                    <div className={`w-full max-w-sm rounded-lg border-2 ${t('bg-[#282B30] border-[#FFB300]', 'bg-white border-amber-900', 'bg-white border-pink-400', 'bg-white border-blue-600', 'bg-white border-emerald-600', 'bg-[#FDFBF7] border-[#8D6E63]')} p-5 shadow-2xl`}>
                        <h3 className={`text-lg font-black mb-4 tracking-widest ${t('text-[#FFB300]', 'text-amber-900', 'text-pink-600', 'text-blue-600', 'text-emerald-700', 'text-[#5D4037]')}`}>
                            {editingItem ? 'РЕДАКТИРОВАТЬ ПОЗИЦИЮ' : 'ДОБАВИТЬ ПОЗИЦИЮ'}
                        </h3>
                        
                        {errorMsg && (
                            <div className="mb-4 p-3 rounded-md text-xs font-bold bg-red-100 border-2 border-red-500 text-red-800 flex items-center shadow-sm">

                                    value={form.manufacturer} onChange={e => setForm({...form, manufacturer: e.target.value})}
                                >
                                    {manufacturers.filter(m => m !== 'Избранное').map(m => <option key={m} value={m}>{m}</option>)}

                            <div>
                                <label className={`text-xs font-bold mb-1 block ${emptyFields.id ? 'text-red-500' : 'opacity-70'}`}>Артикул (ТМ / ID): *</label>
                                <input type="text" className={`w-full p-2 text-[16px] sm:text-sm rounded border font-mono ${emptyFields.id ? 'border-red-500 ring-2 ring-red-500 bg-red-50 text-red-900' : t('bg-[#1E2125] border-gray-700 text-white', 'bg-white border-gray-300', 'bg-white border-pink-200 text-pink-900', 'bg-white border-blue-200 text-blue-900', 'bg-white border-emerald-200 text-emerald-900', 'bg-white border-[#D7CCC8] text-[#3E2723]')}`} value={form.id} onChange={e => { setForm({...form, id: e.target.value}); setEmptyFields({...emptyFields, id: false}); setErrorMsg(''); }} />
                            </div>
                            <div>
                                <label className={`text-xs font-bold mb-1 block ${emptyFields.name ? 'text-red-500' : 'opacity-70'}`}>Название: *</label>
                                <input type="text" className={`w-full p-2 text-[16px] sm:text-sm rounded border ${emptyFields.name ? 'border-red-500 ring-2 ring-red-500 bg-red-50 text-red-900' : t('bg-[#1E2125] border-gray-700 text-white', 'bg-white border-gray-300', 'bg-white border-pink-200 text-pink-900', 'bg-white border-blue-200 text-blue-900', 'bg-white border-emerald-200 text-emerald-900', 'bg-white border-[#D7CCC8] text-[#3E2723]')}`} value={form.name} onChange={e => { setForm({...form, name: e.target.value}); setEmptyFields({...emptyFields, name: false}); setErrorMsg(''); }} />
                            </div>
                            <div>
                                <label className="text-xs font-bold mb-1 block opacity-70">Цена:</label>
                                <input type="text" className={`w-full p-2 text-[16px] sm:text-sm rounded border font-mono ${t('bg-[#1E2125] border-gray-700 text-white', 'bg-white border-gray-300', 'bg-white border-pink-200 text-pink-900', 'bg-white border-blue-200 text-blue-900', 'bg-white border-emerald-200 text-emerald-900', 'bg-white border-[#D7CCC8] text-[#3E2723]')}`} value={form.price} onChange={e => setForm({...form, price: e.target.value})} />
                            </div>
                        </div>

                        <div className="flex justify-end space-x-3">
                            <button onClick={onClose} className="px-4 py-2 text-sm font-bold text-gray-500 hover:text-gray-700">ОТМЕНА</button>
                            <button onClick={handleSave} className={`px-5 py-2 text-sm font-black rounded ${t('bg-[#FFB300] text-black', 'bg-amber-600 text-white', 'bg-pink-500 text-white', 'bg-blue-600 text-white', 'bg-emerald-600 text-white', 'bg-[#6D4C41] text-white', 'bg-[#C62828] text-white hover:bg-[#B71C1C]')}`}>СОХРАНИТЬ</button>
                        </div>
                    </div>
                </div>
            );
        };

        const APP_VERSION = '1.1.0';
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz_B5FydAIcFH4sU5shUgvsjMjNQNcd-_UCLynNewnb7D2Wiz74MDuX9CUzq0F5Lj8/exec';

        const App = () => {
            const [theme, setTheme] = useState(() => localStorage.getItem('sklad_theme') || 'expert');
            const [favorites, setFavorites] = useState(() => {
                try { return JSON.parse(localStorage.getItem('sklad_favorites') || '[]'); } catch { return []; }
            });
            const [customItems, setCustomItems] = useState(() => {
                try { return JSON.parse(localStorage.getItem('sklad_custom_items') || '[]'); } catch { return []; }
            });
            const [catalogEdits, setCatalogEdits] = useState(() => {
                try { return JSON.parse(localStorage.getItem('sklad_catalog_edits') || '{}'); } catch { return {}; }
            });
            const [deletedCatalogIds, setDeletedCatalogIds] = useState(() => {
                try { return JSON.parse(localStorage.getItem('sklad_deleted_ids') || '[]'); } catch { return []; }
            });
            const [catalog, setCatalog] = useState(() => {
                try {
                    const edits = JSON.parse(localStorage.getItem('sklad_catalog_edits') || '{}');
                    const deleted = JSON.parse(localStorage.getItem('sklad_deleted_ids') || '[]');
                    return initialCatalog
                        .filter(item => !deleted.includes(item.id))
                        .map(item => edits[item.id] ? { ...item, ...edits[item.id] } : item);
                } catch { return initialCatalog; }
            });
            const [cart, setCart] = useState(() => {
                try { return JSON.parse(localStorage.getItem('sklad_cart') || '[]'); } catch { return []; }
            });
            const [userProfile, setUserProfile] = useState(() => {
                try { 
                    const p = JSON.parse(localStorage.getItem('sklad_profile') || '{"name":"","phone":"","address":"","pin":""}');
                    return { name: p.name || '', phone: p.phone || '', address: p.address || '', pin: p.pin || '' };
                }
                catch { return { name: '', phone: '', address: '', pin: '' }; }
            });
            const [orderHistory, setOrderHistory] = useState(() => {
                try { return JSON.parse(localStorage.getItem('sklad_order_history') || '[]'); } catch { return []; }
            });
            const [orderCounter, setOrderCounter] = useState(() => {
                const saved = parseInt(localStorage.getItem('sklad_order_counter') || '0', 10);
                return isNaN(saved) ? 0 : saved;
            });
            const [showHistoryModal, setShowHistoryModal] = useState(false);
            const [pendingOrder, setPendingOrder] = useState(null);
            const [currentOrderSaved, setCurrentOrderSaved] = useState(false);
            const [confirmDeleteOrderId, setConfirmDeleteOrderId] = useState(null);

            const [isEditMode, setIsEditMode] = useState(false);
            const [activeTab, setActiveTab] = useState('CROW');
            const [draftQuantities, setDraftQuantities] = useState({});
            
            const [toastMessage, setToastMessage] = useState(null);
            const [copied, setCopied] = useState(false);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3000);
            };
            
            const [showCart, setShowCart] = useState(false);
            const [showCheckout, setShowCheckout] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            const [showProfile, setShowProfile] = useState(false);
            const [showEditModal, setShowEditModal] = useState(false);
            const [editingItem, setEditingItem] = useState(null);
            const [deliveryMethod, setDeliveryMethod] = useState('Самовывоз');
            const [timeStr, setTimeStr] = useState('');
            const [dateStr, setDateStr] = useState('');

            const [showSuccessModal, setShowSuccessModal] = useState(false);
            const [orderText, setOrderText] = useState('');
            const [showCallModal, setShowCallModal] = useState(false);
            const [showBrandDropdown, setShowBrandDropdown] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [confirmClearCart, setConfirmClearCart] = useState(false);
            const [isSyncing, setIsSyncing] = useState(false);
            const lastCheckedPhoneRef = useRef('');
            const [phoneError, setPhoneError] = useState('');
            const [isAuthVerified, setIsAuthVerified] = useState(() => {
                try {
                    const saved = JSON.parse(localStorage.getItem('sklad_profile') || '{}');
                    const ph = String(saved.phone || '').replace(/\D/g, '');
                    const pin = String(saved.pin || '').replace(/\D/g, '');
                    return ph.length === 11 && pin.length === 4 && localStorage.getItem('sklad_auth_verified') === 'true';
                } catch {
                    return false;
                }
            });
            const [showAuthModal, setShowAuthModal] = useState(() => !isAuthVerified);
            const [authError, setAuthError] = useState('');

            useEffect(() => { localStorage.setItem('sklad_theme', theme); }, [theme]);
            useEffect(() => { localStorage.setItem('sklad_favorites', JSON.stringify(favorites)); }, [favorites]);
            useEffect(() => { localStorage.setItem('sklad_custom_items', JSON.stringify(customItems)); }, [customItems]);
            useEffect(() => { localStorage.setItem('sklad_catalog_edits', JSON.stringify(catalogEdits)); }, [catalogEdits]);
            useEffect(() => { localStorage.setItem('sklad_deleted_ids', JSON.stringify(deletedCatalogIds)); }, [deletedCatalogIds]);
            useEffect(() => { localStorage.setItem('sklad_cart', JSON.stringify(cart)); }, [cart]);
            useEffect(() => { localStorage.setItem('sklad_profile', JSON.stringify(userProfile)); }, [userProfile]);
            useEffect(() => { localStorage.setItem('sklad_order_history', JSON.stringify(orderHistory)); }, [orderHistory]);
            useEffect(() => { localStorage.setItem('sklad_order_counter', String(orderCounter)); }, [orderCounter]);

            const normalizePhone = (ph) => String(ph || '').replace(/\D/g, '').replace(/^8/, '7');

            const formatPhoneMask = (value) => {
                let digits = String(value || '').replace(/\D/g, '');
                if (!digits) return '';
                // Если начали вводить с 8 или 7, заменяем первую цифру на код 7
                if (digits[0] === '8' || digits[0] === '7') {
                    digits = '7' + digits.slice(1);
                } else {
                    // Если начали вводить сразу с 9 (например, 919...), добавляем в начало 7
                    digits = '7' + digits;
                }
                digits = digits.slice(0, 11); // Строго максимум 11 цифр

                let res = '+7';
                if (digits.length > 1) res += ' ' + digits.slice(1, 4);
                if (digits.length > 4) res += ' ' + digits.slice(4, 7);
                if (digits.length > 7) res += ' ' + digits.slice(7, 9);
                if (digits.length > 9) res += ' ' + digits.slice(9, 11);
                return res;
            };

            const syncToCloud = async (extraOrder = null, silent = false) => {
                const cleanPhone = normalizePhone(userProfile.phone);
                const cleanPin = String(userProfile.pin || '').replace(/\D/g, '').slice(0, 4);
                if (!cleanPhone || cleanPhone.length !== 11 || cleanPin.length !== 4 || !isAuthVerified || !GOOGLE_SCRIPT_URL.startsWith('http')) {
                    if (!silent) showToast('Укажите корректный номер телефона (11 цифр) и ПИН (4 цифры)');
                    return;
                }
                if (!silent) setIsSyncing(true);
                try {
                    const payload = {
                        theme,
                        favorites,
                        customItems,
                        catalogEdits,
                        deletedCatalogIds,
                        userProfile,
                        orderHistory,
                        orderCounter
                    };
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ phone: cleanPhone, pin: cleanPin, payload, newOrder: extraOrder })
                    });
                    if (!silent) showToast('Данные сохранены в облаке ☁️');
                } catch (e) {
                    if (!silent) showToast('Ошибка связи с облаком');
                } finally {
                    if (!silent) setIsSyncing(false);
                }
            };

            const loadFromCloud = async (phoneToLoad = userProfile.phone, pinToLoad = userProfile.pin, silent = false) => {
                const cleanPhone = normalizePhone(phoneToLoad);
                const cleanPin = String(pinToLoad || '').replace(/\D/g, '').slice(0, 4);
                if (cleanPhone.length !== 11 || cleanPin.length !== 4 || !GOOGLE_SCRIPT_URL.startsWith('http')) return false;
                setIsSyncing(true);
                try {
                    const res = await fetch(`${GOOGLE_SCRIPT_URL}?phone=${encodeURIComponent(cleanPhone)}&pin=${encodeURIComponent(cleanPin)}`);
                    const json = await res.json();

                    if (json.status === 'wrong_pin') {
                        setIsAuthVerified(false);
                        localStorage.removeItem('sklad_auth_verified');
                        setAuthError('Неверный ПИН-код! Этот номер уже зарегистрирован с другим ПИН-кодом.');
                        setPhoneError('Неверный ПИН-код для этого номера!');
                        showToast('❌ Неверный ПИН-код!');
                        return false;
                    }

                    if (json.status === 'ok' && json.payload) {
                        const d = json.payload;
                        if (d.theme) setTheme(d.theme);
                        if (Array.isArray(d.favorites)) setFavorites(d.favorites);
                        if (Array.isArray(d.customItems)) setCustomItems(d.customItems);
                        if (d.catalogEdits) {
                            setCatalogEdits(d.catalogEdits);
                            const del = Array.isArray(d.deletedCatalogIds) ? d.deletedCatalogIds : [];
                            setDeletedCatalogIds(del);
                            setCatalog(
                                initialCatalog
                                    .filter(item => !del.includes(item.id))
                                    .map(item => d.catalogEdits[item.id] ? { ...item, ...d.catalogEdits[item.id] } : item)
                            );
                        }
                        if (d.userProfile) {
                            setUserProfile(prev => ({
                                name: d.userProfile.name || prev.name,
                                phone: formatPhoneMask(phoneToLoad),
                                address: d.userProfile.address || prev.address,
                                pin: cleanPin
                            }));
                        }
                        if (Array.isArray(d.orderHistory)) setOrderHistory(d.orderHistory);
                        if (typeof d.orderCounter === 'number') setOrderCounter(d.orderCounter);

                        lastCheckedPhoneRef.current = `${cleanPhone}_${cleanPin}`;
                        setIsAuthVerified(true);
                        localStorage.setItem('sklad_auth_verified', 'true');
                        setShowAuthModal(false);
                        setAuthError('');
                        setPhoneError('');
                        showToast('Вход выполнен! Данные загружены из облака ☁️');
                        return true;
                    }

                    if (json.status === 'not_found') {
                        lastCheckedPhoneRef.current = `${cleanPhone}_${cleanPin}`;
                        setIsAuthVerified(true);
                        localStorage.setItem('sklad_auth_verified', 'true');
                        setShowAuthModal(false);
                        setAuthError('');
                        setPhoneError('');
                        syncToCloud(null, true);
                        showToast('Аккаунт создан и защищен ПИН-кодом 🔒');
                        return true;
                    }

                    return false;
                } catch (e) {
                    if (!silent) showToast('Нет связи с облаком');
                    return false;
                } finally {
                    setIsSyncing(false);
                }
            };

            // 1. Автопроверка при вводе 11 цифр телефона И 4 цифр ПИН-кода
            useEffect(() => {
                const cleanPhone = normalizePhone(userProfile.phone);
                const cleanPin = String(userProfile.pin || '').replace(/\D/g, '').slice(0, 4);
                if (cleanPhone.length === 11 && cleanPin.length === 4 && lastCheckedPhoneRef.current !== `${cleanPhone}_${cleanPin}`) {
                    const checkTimer = setTimeout(() => {
                        loadFromCloud(userProfile.phone, userProfile.pin, true);
                    }, 400);
                    return () => clearTimeout(checkTimer);
                }
            }, [userProfile.phone, userProfile.pin]);

            // 2. Автосохранение изменений в облако (срабатывает ТОЛЬКО после успешной верификации ПИН-кода)
            useEffect(() => {
                const cleanPhone = normalizePhone(userProfile.phone);
                const cleanPin = String(userProfile.pin || '').replace(/\D/g, '').slice(0, 4);
                if (!isAuthVerified || cleanPhone.length !== 11 || cleanPin.length !== 4 || lastCheckedPhoneRef.current !== `${cleanPhone}_${cleanPin}`) return;
                const syncTimer = setTimeout(() => {
                    syncToCloud(null, true);
                }, 1500);
                return () => clearTimeout(syncTimer);
            }, [favorites, customItems, catalogEdits, deletedCatalogIds, orderHistory, userProfile.name, userProfile.address, isAuthVerified]);

            const commitOrderToHistory = () => {
                if (currentOrderSaved || !pendingOrder || !pendingOrder.items || pendingOrder.items.length === 0) return;
                const nextNum = orderCounter + 1;
                const now = new Date();
                const dateStr = now.toLocaleDateString('ru-RU') + ' ' + now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                const newOrder = {
                    id: Date.now(),
                    orderNumber: nextNum,
                    date: dateStr,
                    deliveryMethod: pendingOrder.deliveryMethod,
                    items: pendingOrder.items,
                    text: pendingOrder.text
                };
                setOrderCounter(nextNum);
                setOrderHistory(prev => [newOrder, ...prev]);
                setCurrentOrderSaved(true);
                setCart([]);
                syncToCloud(newOrder, true);
            };

            const handleExcelUpload = (e) => {
                const file = e.target.files?.[0];
                if (!file || !window.XLSX) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const data = new Uint8Array(evt.target.result);
                        const workbook = window.XLSX.read(data, { type: 'array' });
                        let updatedCount = 0;
                        const newEdits = { ...catalogEdits };
                        const idRedirects = {}; // Старый ТМ -> Новый ТМ (для сохранения Избранного)

                        // Нормализация строки для точного сравнения названий (убирает двойные пробелы и приводит к единому регистру)
                        const norm = (str) => String(str || '').toLowerCase().replace(/c/g, 'с').replace(/\s+/g, ' ').trim();

                        const excelItems = [];
                        let currentSection = '';

                        workbook.SheetNames.forEach(sheetName => {
                            const rows = window.XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header: 1 });
                            rows.forEach(row => {
                                if (!row || row.length === 0) return;
                                const col0 = String(row[0] ?? '').trim();
                                const col1 = String(row[1] ?? '').trim();
                                const col2 = String(row[2] ?? '').trim();

                                // Проверяем, не заголовок ли это раздела (CROW, RITM, СИ-НОРД, Прочее, АКБ и т.д.)
                                if (col0 && !col2 && /^(crow|dahua|ritm|си-норд|мы дома|wer|honeywell|прочее|акб|камеры)$/i.test(col0)) {
                                    currentSection = col0.toUpperCase();
                                    return;
                                }

                                let tm = '', excelName = '', rawPrice = col2;
                                if (/^(ТМ-|КТ-|ИН-|МАТ-|sim |б-тм)/i.test(col0)) {
                                    tm = col0; excelName = col1;
                                } else if (/^(ТМ-|КТ-|ИН-|МАТ-|sim |б-тм)/i.test(col1)) {
                                    tm = col1; excelName = col0;
                                } else {
                                    return;
                                }

                                const cleanPriceNum = String(rawPrice).replace(/[^\d.,]/g, '').replace(',', '.');
                                const formattedPrice = rawPrice
                                    ? (String(rawPrice).includes('р') ? String(rawPrice).trim() : `${cleanPriceNum || '0'}р.`)
                                    : '0р.';

                                excelItems.push({ tm, excelName, formattedPrice, section: currentSection });
                            });
                        });

                        setCatalog(prevCatalog => prevCatalog.map(item => {
                            // 1. Сначала ищем точное совпадение по ТМ (меняем ТОЛЬКО цену, название НЕ трогаем)
                            const matchByTm = excelItems.find(ex => ex.tm.toLowerCase() === item.id.toLowerCase());
                            if (matchByTm) {
                                updatedCount++;
                                const updatedItem = { ...item, price: matchByTm.formattedPrice };
                                newEdits[item.id] = updatedItem;
                                return updatedItem;
                            }

                            // 2. Если ТМ в файле изменился, ищем совпадение по названию (включая название без суффикса бренда)
                            const itemNorm = norm(item.name);
                            const brandNorm = norm(item.manufacturer);
                            const itemWithoutBrand = itemNorm.endsWith(' ' + brandNorm)
                                ? itemNorm.slice(0, -(brandNorm.length + 1)).trim()
                                : itemNorm;

                            const matchByName = excelItems.find(ex => {
                                const exNorm = norm(ex.excelName);
                                if (!exNorm) return false;
                                const sectionOk = !ex.section || ex.section === brandNorm.toUpperCase();
                                return sectionOk && (exNorm === itemNorm || exNorm === itemWithoutBrand);
                            });

                            if (matchByName) {
                                updatedCount++;
                                // Меняем ТМ и цену, но НАЗВАНИЕ (item.name) оставляем прежним!
                                const updatedItem = {
                                    ...item,
                                    id: matchByName.tm,
                                    name: item.name,
                                    price: matchByName.formattedPrice
                                };
                                idRedirects[item.id] = matchByName.tm;
                                newEdits[item.id] = updatedItem;
                                return updatedItem;
                            }

                            return item;
                        }));

                        // Если у какой-то позиции обновился ТМ, обновляем его и в Избранном, чтобы звезда не слетела
                        if (Object.keys(idRedirects).length > 0) {
                            setFavorites(prevFavs => prevFavs.map(favId => idRedirects[favId] || favId));
                        }

                        setCatalogEdits(newEdits);
                        showToast(`Прайс загружен: обновлено ${updatedCount} поз.`);
                    } catch (err) {
                        showToast('Ошибка при чтении файла Excel');
                    }
                    e.target.value = '';
                };
                reader.readAsArrayBuffer(file);
            };

            const t = (dark, light, pink, marine, mint, coffee, expert) => {
                if (theme === 'newyear') {
                    return (dark || light)
                        // Фоны экрана, карточек и полей ввода -> глубокий хвойно-изумрудный стиль
                        .replace(/bg-\[#101112\]/g, 'bg-[#0A1912]')
                        .replace(/bg-\[#282B30\]/g, 'bg-[#11261D]')
                        .replace(/bg-\[#1E2125\]/g, 'bg-[#0D1F17]')
                        .replace(/hover:bg-\[#33363B\]/g, 'hover:bg-[#19382B]')
                        // Рамки карточек и разделители -> хвойно-золотистые
                        .replace(/border-\[#3A3D42\]/g, 'border-[#1E3F30]')
                        .replace(/border-gray-800/g, 'border-[#1A382A]')
                        .replace(/border-gray-700/g, 'border-[#234736]')
                        .replace(/border-\[#444\]/g, 'border-[#234736]')
                        // Главные акцентные кнопки -> праздничный рубиново-красный с золотистой тенью
                        .replace(/bg-\[#FFB300\] text-black/g, 'bg-gradient-to-r from-[#B71C1C] to-[#D32F2F] text-white border border-[#FBBF24]/40')
                        .replace(/hover:bg-\[#FFA000\]/g, 'hover:from-[#9A1B24] hover:to-[#B71C1C]')
                        .replace(/bg-\[#FFB300\]\/20/g, 'bg-[#FBBF24]/20')
                        .replace(/bg-\[#FFB300\]\/15/g, 'bg-[#FBBF24]/15')
                        .replace(/bg-\[#FFB300\]/g, 'bg-[#C62828] text-white')
                        // Акцентный текст (артикулы, активные табы, заголовки) -> искристое золото
                        .replace(/text-\[#FFB300\]/g, 'text-[#FBBF24]')
                        // Золотые рамки и кольца фокуса
                        .replace(/border-\[#FFB300\]\/50/g, 'border-[#FBBF24]/50')
                        .replace(/border-\[#FFB300\]/g, 'border-[#FBBF24]')
                        .replace(/focus:ring-\[#FFB300\]/g, 'focus:ring-[#FBBF24]')
                        .replace(/shadow-\[#FFB300\]\/\d+/g, 'shadow-[#C62828]/40');
                }
                if (theme === 'expert') {
                    if (expert) return expert;
                    return (light || dark)
                        // Фон серый для подложек
                        .replace(/bg-gray-100/g, 'bg-[#F4F5F7]')
                        // Все насыщенные и темные янтарные заливки меняем на фирменный красный
                        .replace(/bg-amber-(400|500|600|700|800|900|950)/g, 'bg-[#C62828]')
                        .replace(/bg-\[#FFB300\]\/15/g, 'bg-[#FCE8E8]')
                        .replace(/bg-\[#FFB300\]/g, 'bg-[#C62828]')
                        // Наведение на кнопки
                        .replace(/hover:bg-amber-(500|600|700|800|900|950)/g, 'hover:bg-[#B71C1C]')
                        // Полупрозрачный текст подписей
                        .replace(/text-amber-\d+\/(40|50|60|70)/g, 'text-gray-500')
                        // Все акцентные янтарные тексты меняем на темный бордовый
                        .replace(/text-amber-(400|500|600|700|800|900|950)/g, 'text-[#9A1B24]')
                        .replace(/text-\[#FFB300\]/g, 'text-[#9A1B24]')
                        // Рамки и кольца фокуса
                        .replace(/border-amber-(500|600|700|800|900|950)/g, 'border-[#C62828]')
                        .replace(/border-\[#FFB300\](\/50)?/g, 'border-[#C62828]')
                        .replace(/focus:ring-amber-\d+/g, 'focus:ring-[#C62828]')
                        .replace(/focus:border-amber-\d+/g, 'focus:border-[#C62828]')
                        .replace(/shadow-amber-\d+\/\d+/g, 'shadow-[#C62828]/30');
                }
                if (theme === 'expert-dark') {
                    if (dark && dark.includes('bg-[#FFB300]/15')) return dark;
                    return (dark || light)
                        // Заливки главных кнопок и бейджей -> фирменный красный с белым текстом
                        .replace(/bg-\[#FFB300\] text-black/g, 'bg-[#C62828] text-white')
                        .replace(/bg-\[#FFB300\]\/20/g, 'bg-[#C62828]/25')
                        .replace(/bg-\[#FFB300\]/g, 'bg-[#C62828]')
                        .replace(/hover:bg-\[#FFA000\]/g, 'hover:bg-[#B71C1C]')
                        // Акцентный текст (заголовки, активные вкладки, артикулы) -> светлый рубиново-коралловый для высокой контрастности на темном фоне
                        .replace(/text-\[#FFB300\]/g, 'text-[#FF5252]')
                        // Рамки и кольца фокуса -> рубиновые
                        .replace(/border-\[#FFB300\]\/50/g, 'border-[#EF4444]/50')
                        .replace(/border-\[#FFB300\]\/30/g, 'border-[#EF4444]/30')
                        .replace(/border-\[#FFB300\]/g, 'border-[#C62828]')
                        .replace(/focus:ring-\[#FFB300\]/g, 'focus:ring-[#EF4444]')
                        .replace(/shadow-\[#FFB300\]\/\d+/g, 'shadow-[#C62828]/30');
                }
                if (theme === 'marine') {
                    return (marine || dark)
                        .replace(/bg-blue-50\/50/g, 'bg-[#131D31]')
                        .replace(/bg-blue-50/g, 'bg-[#0B132B]')
                        .replace(/bg-blue-100/g, 'bg-[#162238]')
                        .replace(/bg-blue-200/g, 'bg-[#1E3A5F]')
                        .replace(/bg-white/g, 'bg-[#162032] text-blue-50')
                        .replace(/text-blue-950/g, 'text-blue-50')
                        .replace(/text-blue-900\/60/g, 'text-blue-300/50')
                        .replace(/text-blue-900/g, 'text-blue-100')
                        .replace(/text-blue-800/g, 'text-blue-200')
                        .replace(/text-blue-700/g, 'text-sky-400')
                        .replace(/text-blue-600/g, 'text-sky-400')
                        .replace(/border-blue-200/g, 'border-[#253652]')
                        .replace(/border-blue-300/g, 'border-sky-500/50');
                }
                if (theme === 'coffee') {
                    return (coffee || dark)
                        .replace(/bg-\[#F5F2EE\]/g, 'bg-[#16110F]')
                        .replace(/bg-\[#EFEBE9\]/g, 'bg-[#221A17]')
                        .replace(/bg-\[#FDFBF7\]/g, 'bg-[#241C19] text-[#F5EBE6]')
                        .replace(/bg-\[#D7CCC8\]\/60/g, 'bg-[#362924]')
                        .replace(/bg-\[#D7CCC8\]\/40/g, 'bg-[#362924]')
                        .replace(/bg-\[#D7CCC8\]/g, 'bg-[#382B26]')
                        .replace(/bg-white/g, 'bg-[#241C19] text-[#F5EBE6]')
                        .replace(/text-\[#3E2723\]/g, 'text-[#F5EBE6]')
                        .replace(/text-\[#4E342E\]/g, 'text-[#E6D5CC]')
                        .replace(/text-\[#5D4037\]/g, 'text-[#D7B399]')
                        .replace(/text-\[#6D4C41\]\/60/g, 'text-[#A1887F]/60')
                        .replace(/text-\[#6D4C41\]/g, 'text-[#E0B084]')
                        .replace(/text-\[#8D6E63\]/g, 'text-[#D7B399]')
                        .replace(/border-\[#D7CCC8\]/g, 'border-[#3E2F2A]')
                        .replace(/border-\[#A1887F\]/g, 'border-[#6D4C41]');
                }
                if (theme === 'mint') return mint;
                if (theme === 'pink') return pink;
                if (theme === 'light') return light;
                return dark;
            };

            useEffect(() => {
                const interval = setInterval(() => {
                    const now = new Date();
                    const day = String(now.getDate()).padStart(2, '0');
                    const month = String(now.getMonth() + 1).padStart(2, '0');
                    const year = now.getFullYear();
                    const weekdays = ['ВС', 'ПН', 'ВТ', 'СР', 'ЧТ', 'ПТ', 'СБ'];
                    const weekday = weekdays[now.getDay()];
                    
                    const h = String(now.getHours()).padStart(2, '0');
                    const m = String(now.getMinutes()).padStart(2, '0');
                    const s = String(now.getSeconds()).padStart(2, '0');

                    setDateStr(`${day}.${month}.${year}   ${weekday}`);
                    setTimeStr(`${h}:${m}:${s}`);
                }, 1000);
                return () => clearInterval(interval);
            }, []);

            const toggleFavorite = (id) => {
                const item = catalog.find(i => i.id === id) || customItems.find(i => i.id === id);
                const currentDraft = draftQuantities[id] || 0;
                
                setFavorites(prev => {
                    if (prev.includes(id)) {
                        if (item) showToast(`Удалено из избранного: ${item.name}`);
                        return prev.filter(f => f !== id);
                    } else {
                        if (item) showToast(`В избранное: [${item.id}] ${item.name} x ${currentDraft > 0 ? currentDraft : 0} шт.`);
                        return [...prev, id];
                    }
                });
            };

            const getDraftQty = (id) => draftQuantities[id] !== undefined ? draftQuantities[id] : 0;
            const updateDraftQty = (id, delta) => setDraftQuantities(prev => {
                let current = prev[id] || 0;
                if (current === '') current = 0;
                current += delta;
                if (current < 0) current = 0;
                return { ...prev, [id]: current };
            });
            const setAbsoluteDraftQty = (id, value) => {
                if (value === '') return setDraftQuantities(prev => ({ ...prev, [id]: '' }));
                let current = parseInt(value, 10);
                if (isNaN(current) || current < 0) current = 0;
                setDraftQuantities(prev => ({ ...prev, [id]: current }));
            };
            const clearDraftQty = (id) => setDraftQuantities(prev => ({ ...prev, [id]: 0 }));

            const addToCart = (item, qty) => {
                if (qty <= 0) return;
                setCart(prev => {
                    const existing = prev.find(i => i.equipment.id === item.id);
                    if (existing) return prev.map(i => i.equipment.id === item.id ? { ...i, quantity: i.quantity + qty } : i);
                    return [{ equipment: item, quantity: qty }, ...prev];
                });
                clearDraftQty(item.id);
                showToast(`${qty}шт ${item.name} добавлено в корзину`);
            };

            const draftItemsIds = Object.keys(draftQuantities).filter(id => draftQuantities[id] > 0);
            const totalDraftItems = draftItemsIds.length;

            const addAllDraftsToCart = () => {
                if (totalDraftItems === 0) return;
                const itemsToAdd = [];
                draftItemsIds.forEach(id => {
                    const qty = draftQuantities[id];
                    const item = catalog.find(i => i.id === id) || customItems.find(i => i.id === id);
                    if (item && qty > 0) itemsToAdd.push({ item, qty });
                });
                if (itemsToAdd.length === 0) return;

                setCart(prev => {
                    const newCart = [...prev];
                    itemsToAdd.forEach(({ item, qty }) => {
                        const existing = newCart.find(i => i.equipment.id === item.id);
                        if (existing) existing.quantity += qty;
                        else newCart.push({ equipment: item, quantity: qty });
                    });
                    return newCart;
                });
                setDraftQuantities({});
                if (itemsToAdd.length === 1) showToast(`${itemsToAdd[0].qty}шт ${itemsToAdd[0].item.name} добавлено в корзину`);
                else showToast(`В корзину добавлено позиций: ${itemsToAdd.length}`);
            };

            const removeFromCart = (id) => setCart(prev => prev.filter(i => i.equipment.id !== id));
            const updateCartQty = (id, delta) => setCart(prev => prev.map(i => i.equipment.id === id ? { ...i, quantity: i.quantity + delta } : i).filter(i => i.quantity > 0));

            const totalCartPositions = cart.length;
            const totalCartUnits = cart.reduce((sum, item) => sum + item.quantity, 0);

            const systemBrands = ['CROW', 'Dahua', 'RITM', 'СИ-НОРД', 'Мы дома', 'Honeywell'];
            const mainTabs = ['Прочее', 'АКБ', 'Камеры', 'Избранное', 'Мое'];

            const uniqueById = (arr) => Array.from(new Map(arr.map(item => [item.id, item])).values());

            const displayedItems = useMemo(() => {
                const q = searchQuery.trim().toLowerCase();
                if (q !== '') {
                    const allItems = [...catalog, ...customItems.filter(ci => !catalog.find(c => c.id === ci.id))];
                    const filtered = allItems.filter(item =>
                        item.id.toLowerCase().includes(q) || item.name.toLowerCase().includes(q)
                    );
                    return uniqueById(filtered);
                }
                if (activeTab === 'Избранное') return uniqueById(catalog.filter(item => favorites.includes(item.id)));
                if (activeTab === 'Мое') return customItems;
                return catalog.filter(item => item.manufacturer === activeTab);
            }, [catalog, activeTab, favorites, customItems, searchQuery]);

            const groupedItems = useMemo(() => {
                const groups = {};
                displayedItems.forEach(item => {
                    if (!groups[item.category]) groups[item.category] = [];
                    groups[item.category].push(item);
                });
                return groups;
            }, [displayedItems]);

            const handleCopyOrder = () => {
                const textArea = document.createElement("textarea");
                textArea.value = orderText;
                textArea.style.position = "fixed";
                textArea.style.left = "-9999px";
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                    showToast('Заявка скопирована в буфер обмена!');
                } catch (err) {
                    showToast('Ошибка при копировании!');
                }
                document.body.removeChild(textArea);
            };

            useEffect(() => {
                document.body.style.backgroundColor = theme === 'newyear' ? '#0A1912' : theme === 'expert-dark' ? '#101112' : t('#101112', '#F0F2F5', '#fdf2f8', '#0B132B', '#f0fdf4', '#16110F', '#F4F5F7');
                document.body.style.color = (theme === 'newyear' || theme === 'expert-dark') ? '#F3F4F6' : t('#F3F4F6', '#111827', '#831843', '#F0F9FF', '#14532d', '#F5EBE6', '#111827');
            }, [theme]);

            return (
                <div className={`fixed inset-0 flex flex-col w-full overflow-hidden transition-colors duration-200 ${(theme === 'expert-dark' || theme === 'dark') ? 'bg-[#101112] text-gray-100' : theme === 'newyear' ? 'bg-[#0A1912] text-gray-100' : t('bg-[#101112] text-gray-100', 'bg-[#F0F2F5] text-gray-900', 'bg-pink-50 text-pink-950', 'bg-[#0B132B] text-blue-50', 'bg-emerald-50 text-emerald-950', 'bg-[#16110F] text-[#F5EBE6]', 'bg-[#F4F5F7] text-gray-900')}`}>
                    
                    {theme === 'newyear' && (
                        <div className="fixed inset-0 pointer-events-none overflow-hidden z-40">
                            {[
                                { left: '5%', dur: '9s', delay: '0s', size: '12px' },
                                { left: '15%', dur: '12s', delay: '2s', size: '16px' },
                                { left: '25%', dur: '10s', delay: '4s', size: '10px' },
                                { left: '35%', dur: '14s', delay: '1s', size: '14px' },
                                { left: '48%', dur: '11s', delay: '3s', size: '12px' },
                                { left: '60%', dur: '13s', delay: '5s', size: '15px' },
                                { left: '72%', dur: '9.5s', delay: '1.5s', size: '11px' },
                                { left: '83%', dur: '12.5s', delay: '3.5s', size: '16px' },
                                { left: '92%', dur: '10.5s', delay: '0.5s', size: '13px' }
                            ].map((s, idx) => (
                                <span 
                                    key={idx} 
                                    className="snowflake" 
                                    style={{ left: s.left, animationDuration: s.dur, animationDelay: s.delay, fontSize: s.size }}
                                >
                                    ❄
                                </span>
                            ))}
                        </div>
                    )}

                    {toastMessage && (
                        <div className={`fixed top-1.5 sm:top-2 left-1/2 transform -translate-x-1/2 z-[60] px-3 sm:px-5 py-1.5 sm:py-2 rounded-lg border-2 shadow-xl font-mono text-[11px] sm:text-xs font-black tracking-wide text-center max-w-[92vw] sm:max-w-md md:max-w-lg truncate pointer-events-none transition-all ${t(
                            'bg-[#282B30] border-[#FFB300] text-[#FFB300]',
                            'bg-white border-amber-600 text-amber-900',
                            'bg-white border-pink-500 text-pink-700',
                            'bg-white border-blue-600 text-blue-800',
                            'bg-white border-emerald-600 text-emerald-800',
                            'bg-[#FDFBF7] border-[#8D6E63] text-[#5D4037]',
                            'bg-white border-[#C62828] text-[#9A1B24] shadow-black/20'
                        )}`}>
                            {toastMessage}
                        </div>
                    )}

                    <header className={`flex-shrink-0 px-4 py-3 flex items-center justify-between shadow-lg border-b z-10 text-white ${
                        theme === 'newyear' 
                            ? 'bg-gradient-to-r from-[#0F291E] via-[#7F1D1D] to-[#0F291E] border-[#FBBF24]/60'
                            : (theme === 'expert' || theme === 'expert-dark') 
                                ? 'bg-gradient-to-r from-[#4A0B11] via-[#75161F] to-[#4A0B11] border-b border-[#C62828]/50 text-white shadow-lg' 
                                : t(
                                    'bg-gradient-to-r from-[#1A1D21] via-[#282B30] to-[#1A1D21] border-[#FFB300]/50',
                                    'bg-gradient-to-r from-amber-700 via-amber-600 to-amber-700 border-amber-800',
                                    'bg-gradient-to-r from-pink-700 via-pink-600 to-pink-700 border-pink-800',
                                    'bg-gradient-to-r from-[#0F2547] via-[#1D4ED8] to-[#0F2547] border-blue-400/30',
                                    'bg-gradient-to-r from-emerald-800 via-emerald-600 to-emerald-800 border-emerald-900',
                                    'bg-gradient-to-r from-[#3E2723] via-[#5D4037] to-[#3E2723] border-[#8D6E63]/40'
                                )
                    }`}>
                        <div className="flex items-center space-x-3">
                            <div className="flex flex-col">
                                <div className="flex items-center space-x-2">
                                    <span className="text-[11px] font-extrabold tracking-wider font-mono text-white/85">{dateStr}</span>
                                    {isEditMode && (
                                        <button 
                                            onClick={() => setIsEditMode(false)}
                                            className="flex items-center px-2 py-0.5 rounded text-[10px] font-black tracking-widest bg-red-600 text-white shadow hover:bg-red-700 transition-colors animate-pulse"
                                            title="Отключить режим редактирования"
                                        >
                                            <Icon name="pen-off" size={12} className="mr-1" />
                                            РЕДАКТ.
                                        </button>
                                    )}
                                </div>
                                <span className="text-[15px] font-black tracking-widest font-mono text-white flex items-center">
                                    {theme === 'newyear' && <span className="mr-1.5 text-sm animate-pulse">🎄</span>}
                                    {timeStr}
                                    {theme === 'newyear' && <span className="ml-1.5 text-xs text-[#FBBF24]">✨</span>}
                                </span>
                            </div>
                        </div>
                        <div className="flex items-center space-x-1">
                            <button
                                className="p-2 rounded-full text-white hover:bg-white/15 active:scale-95 transition-all"
                                onClick={() => setShowCallModal(true)}
                            >
                                <Icon name="phone" className="text-white" strokeWidth={2.2} />
                            </button>
                            <button
                                className="p-2 rounded-full text-white hover:bg-white/15 active:scale-95 transition-all"
                                onClick={() => setShowSettings(true)}
                            >
                                <Icon name="settings" className="text-white" strokeWidth={2.2} />
                            </button>
                            <button
                                className="relative p-2 rounded-full text-white hover:bg-white/15 active:scale-95 transition-all"
                                onClick={() => setShowCart(true)}
                            >
                                <Icon name="shopping-cart" className="text-white" strokeWidth={2.2} />
                                {totalCartUnits > 0 && (
                                    <span className="absolute top-0.5 right-0.5 bg-red-500 border border-white text-white text-[10px] font-black px-1.5 py-0.5 rounded-full shadow">
                                        {totalCartUnits}
                                    </span>
                                )}
                            </button>
                        </div>
                    </header>

                    <div className={`flex-shrink-0 border-b ${t('bg-[#282B30] border-gray-800', 'bg-white border-gray-200', 'bg-pink-100 border-pink-200', 'bg-blue-100 border-blue-200', 'bg-emerald-100 border-emerald-200', 'bg-[#EFEBE9] border-[#D7CCC8]')}`}>
                        <div className="flex items-stretch relative">
                            <div className="relative flex-shrink-0">
                                <button
                                    onClick={() => setShowBrandDropdown(prev => !prev)}
                                    className={`h-full px-2 sm:px-3.5 py-2.5 text-[10px] sm:text-[13px] font-bold tracking-wide border-b-2 whitespace-nowrap flex items-center transition-colors
                                        ${systemBrands.includes(activeTab)
                                            ? t('border-[#FFB300] text-[#FFB300]', 'border-amber-900 text-amber-900', 'border-pink-600 text-pink-600', 'border-blue-600 text-blue-600', 'border-emerald-600 text-emerald-700', 'border-[#6D4C41] text-[#5D4037]')
                                            : t('border-transparent text-gray-500', 'border-transparent text-amber-900/60', 'border-transparent text-pink-900/60', 'border-transparent text-blue-900/60', 'border-transparent text-emerald-900/60', 'border-transparent text-[#6D4C41]/60')}
                                    `}
                                >
                                    <span>{systemBrands.includes(activeTab) ? activeTab.toUpperCase() : 'СИСТЕМЫ'}</span>
                                    <Icon name={showBrandDropdown ? 'chevron-up' : 'chevron-down'} size={13} className="ml-1" />
                                </button>
                                {showBrandDropdown && (
                                    <div className={`absolute left-0 top-full mt-1 z-50 rounded-lg border-2 shadow-2xl min-w-[160px] overflow-hidden ${t('bg-[#282B30] border-[#FFB300]', 'bg-white border-amber-900', 'bg-white border-pink-400', 'bg-white border-blue-600', 'bg-white border-emerald-600', 'bg-[#FDFBF7] border-[#8D6E63]')}`}>
                                        {systemBrands.map(brand => (
                                            <button
                                                key={brand}
                                                onClick={() => { setActiveTab(brand); setShowBrandDropdown(false); setSearchQuery(''); }}
                                                className={`w-full text-left px-4 py-2.5 text-[12px] font-bold tracking-wide transition-colors
                                                    ${activeTab === brand
                                                        ? t('bg-[#FFB300]/20 text-[#FFB300]', 'bg-amber-100 text-amber-900', 'bg-pink-100 text-pink-700', 'bg-blue-100 text-blue-700', 'bg-emerald-100 text-emerald-800', 'bg-[#EFEBE9] text-[#5D4037]')
                                                        : t('text-gray-300 hover:bg-[#33363B]', 'text-gray-700 hover:bg-gray-100', 'text-pink-900 hover:bg-pink-50', 'text-blue-900 hover:bg-blue-50', 'text-emerald-900 hover:bg-emerald-50', 'text-[#3E2723] hover:bg-[#EFEBE9]')}
                                                `}
                                            >
                                                {brand}
                                            </button>
                                        ))}
                                    </div>
                                )}
                            </div>
                            <div className={`w-px my-2 ${t('bg-gray-700', 'bg-gray-200', 'bg-pink-200', 'bg-blue-200', 'bg-emerald-200', 'bg-[#D7CCC8]')}`} />
                            {mainTabs.map(m => (
                                <button
                                    key={m}
                                    onClick={() => { setActiveTab(m); setShowBrandDropdown(false); setSearchQuery(''); }}
                                    className={`px-2 sm:px-3.5 py-2.5 whitespace-nowrap text-[10px] sm:text-[13px] font-bold tracking-wide border-b-2 transition-colors flex items-center
                                        ${activeTab === m
                                            ? t('border-[#FFB300] text-[#FFB300]', 'border-amber-900 text-amber-900', 'border-pink-600 text-pink-600', 'border-blue-600 text-blue-600', 'border-emerald-600 text-emerald-700', 'border-[#6D4C41] text-[#5D4037]')
                                            : t('border-transparent text-gray-500', 'border-transparent text-amber-900/60', 'border-transparent text-pink-900/60', 'border-transparent text-blue-900/60', 'border-transparent text-emerald-900/60', 'border-transparent text-[#6D4C41]/60')}
                                    `}
                                >
                                    {m === 'Избранное' && <Icon name="star" size={13} className="mr-1" />}
                                    {m.toUpperCase()}
                                </button>
                            ))}
                        </div>
                        <div className={`px-3 py-2 border-t ${t('border-gray-800', 'border-gray-200', 'border-pink-200', 'border-blue-200', 'border-emerald-200', 'border-[#D7CCC8]')}`}>
                            <div className={`flex items-center rounded-lg border px-3 ${t('bg-[#1E2125] border-[#444]', 'bg-gray-50 border-gray-300', 'bg-pink-50 border-pink-200', 'bg-blue-50 border-blue-200', 'bg-emerald-50 border-emerald-200', 'bg-white border-[#D7CCC8]')}`}>
                                <Icon name="search" size={15} className={`flex-shrink-0 mr-2 ${t('text-gray-500', 'text-gray-400', 'text-pink-400', 'text-blue-400', 'text-emerald-500', 'text-[#A1887F]')}`} />
                                <input
                                    type="text"
                                    value={searchQuery}
                                    onChange={e => setSearchQuery(e.target.value)}
                                    placeholder="Поиск по артикулу или названию..."
                                    className={`flex-1 py-2 bg-transparent outline-none text-[16px] sm:text-sm font-medium ${t('text-gray-100 placeholder:text-gray-600', 'text-gray-800 placeholder:text-gray-400', 'text-pink-900 placeholder:text-pink-400', 'text-blue-900 placeholder:text-blue-400', 'text-emerald-950 placeholder:text-emerald-500', 'text-[#3E2723] placeholder:text-[#A1887F]')}`}
                                />
                                {searchQuery && (
                                    <button onClick={() => setSearchQuery('')} className={`flex-shrink-0 ml-1 p-1 rounded-full ${t('text-gray-500 hover:text-gray-300', 'text-gray-400 hover:text-gray-600', 'text-pink-400 hover:text-pink-600', 'text-blue-400 hover:text-blue-600', 'text-emerald-500 hover:text-emerald-700', 'text-[#A1887F] hover:text-[#5D4037]')}`}>
                                        <Icon name="x" size={15} />
                                    </button>
                                )}
                            </div>
                        </div>
                    </div>

                    <div className="flex-1 overflow-y-auto p-3 sm:p-4 transition-all" style={{ paddingBottom: '180px' }}>
                        {activeTab === 'Мое' && (
                            <div className="mb-4 flex justify-center">
                                <button 
                                    onClick={() => {
                                        setIsEditMode(true);
                                        setEditingItem(null); 
                                        setShowEditModal(true); 
                                    }}
                                    className={`w-full sm:w-auto px-6 py-3.5 rounded-xl text-xs font-black tracking-widest shadow-xl flex items-center justify-center transition-all active:scale-95 ${t('bg-[#FFB300] text-black shadow-[#FFB300]/20', 'bg-amber-600 text-white shadow-amber-600/30', 'bg-pink-500 text-white shadow-pink-500/30', 'bg-blue-600 text-white shadow-blue-600/30', 'bg-emerald-600 text-white shadow-emerald-600/30', 'bg-[#6D4C41] text-white shadow-[#6D4C41]/30')}`}
                                >
                                    <Icon name="plus" size={18} className="mr-2" />
                                    ДОБАВИТЬ ОБОРУДОВАНИЕ
                                </button>
                            </div>
                        )}
                        {displayedItems.length === 0 ? (
                            <div className="text-center mt-20 flex flex-col items-center justify-center">
                                <div className="text-sm font-bold text-gray-500 opacity-70 uppercase tracking-widest mb-6">
                                    {activeTab === 'Мое' ? 'Здесь будет оборудование которое вы создали' : 'ОБОРУДОВАНИЕ НЕ НАЙДЕНО'}
                                </div>

                            </div>
                        ) : (
                            Object.keys(groupedItems).map(category => (
                                <div key={category} className={`mb-5 ${category === 'Базовый комплект' && activeTab !== 'Избранное' && activeTab !== 'Мое' ? t('p-3 bg-[#1E2125] border border-[#FFB300] rounded-lg', 'p-3 bg-amber-50/50 border border-amber-900/20 rounded-lg', 'p-3 bg-pink-100/50 border border-pink-400 rounded-lg', 'p-3 bg-blue-50 border border-blue-300 rounded-lg', 'p-3 bg-emerald-50 border border-emerald-300 rounded-lg', 'p-3 bg-[#EFEBE9] border border-[#A1887F] rounded-lg') : ''}`}>
                                    <h2 className={`text-[15px] font-black tracking-widest uppercase mb-3 flex items-center ${t('text-[#FFB300]', 'text-amber-900', 'text-pink-600', 'text-blue-600', 'text-emerald-700', 'text-[#5D4037]')}`}>
                                        <div className={`w-1 h-5 mr-2 ${t('bg-[#FFB300]', 'bg-amber-900', 'bg-pink-500', 'bg-blue-600', 'bg-emerald-600', 'bg-[#6D4C41]')}`}></div>
                                        {category}
                                    </h2>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        {groupedItems[category].map(item => {
                                            const qtyInCart = cart.find(i => i.equipment.id === item.id)?.quantity || 0;
                                            const draftQty = getDraftQty(item.id);
                                            const isFav = favorites.includes(item.id);

                                            return (
                                                <div key={item.id} className={`relative flex flex-col justify-between p-4 rounded-md border ${t('bg-[#282B30] border-[#3A3D42]', 'bg-white border-gray-200 shadow-sm', 'bg-white border-pink-200 shadow-sm', 'bg-white border-blue-200 shadow-sm', 'bg-white border-emerald-200 shadow-sm', 'bg-white border-[#D7CCC8] shadow-sm')}`}>
                                                    
                                                    <div className="absolute top-0 right-0">
                                                        <button 
                                                            onClick={() => toggleFavorite(item.id)}
                                                            className="p-3 transition-transform hover:scale-110 outline-none"
                                                        >
                                                            <Icon 
                                                                name="star" 
                                                                size={22} 
                                                                className={t('text-[#FFB300]', 'text-amber-700', 'text-pink-500', 'text-blue-600', 'text-emerald-600', 'text-[#8D6E63]')}

                                                            />
                                                        </button>
                                                    </div>

                                                    <div>
                                                        <h3 className="text-[14px] font-bold pr-14 leading-tight mb-2">{item.name}</h3>
                                                        <div className="flex items-center space-x-3 mb-3">
                                                            <span className={`px-2 py-0.5 rounded text-[11px] font-bold font-mono ${t('bg-[#1E2125] text-[#FFB300]', 'bg-gray-100 text-amber-900', 'bg-pink-100 text-pink-700', 'bg-blue-50 text-blue-700', 'bg-emerald-50 text-emerald-800', 'bg-[#D7CCC8]/40 text-[#3E2723]')}`}>
                                                                {item.id}
                                                            </span>
                                                            <span className="text-[12px] font-mono opacity-60">{item.price}</span>
                                                        </div>
                                                    </div>
                                                    
                                                    <div>
                                                        {(qtyInCart > 0 || isEditMode) && (
                                                            <div className="flex justify-end items-center mb-3 space-x-2">
                                                                {isEditMode && (
                                                                    <>
                                                                        <button onClick={() => { setEditingItem(item); setShowEditModal(true); }} className={`p-1 ${t('text-[#FFB300]', 'text-amber-500', 'text-pink-500', 'text-blue-600', 'text-emerald-600', 'text-[#8D6E63]')}`}><Icon name="pencil" size={16}/></button>
                                                                        <button onClick={() => {
                                                                            setCatalog(p => p.filter(i => i.id !== item.id));
                                                                            setCustomItems(p => p.filter(i => i.id !== item.id));
                                                                            setDeletedCatalogIds(p => p.includes(item.id) ? p : [...p, item.id]);
                                                                            setCatalogEdits(p => { const copy = { ...p }; delete copy[item.id]; return copy; });
                                                                            showToast(`Товар ${item.id} удален`);
                                                                        }} className="p-1 text-red-500"><Icon name="trash-2" size={16}/></button>
                                                                    </>
                                                                )}
                                                                {qtyInCart > 0 && (
                                                                    <div className="flex items-center space-x-2">
                                                                        <span className={`px-2 py-1 rounded text-[10px] font-black border ${t('bg-[#33FF33]/15 text-[#33FF33] border-[#33FF33]/60', 'bg-green-100 text-green-700 border-green-300', 'bg-fuchsia-100 text-fuchsia-700 border-fuchsia-300', 'bg-blue-100 text-blue-700 border-blue-300', 'bg-emerald-100 text-emerald-800 border-emerald-300', 'bg-[#D7CCC8]/60 text-[#3E2723] border-[#A1887F]')}`}>
