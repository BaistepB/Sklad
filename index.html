                                                                        </span>
                                                                        <button onClick={() => removeFromCart(item.id)} className={`px-2 py-1 rounded text-[10px] font-black border ${t('bg-white text-black border-white', 'bg-white text-gray-600 border-gray-300', 'bg-white text-pink-600 border-pink-300', 'bg-white text-blue-600 border-blue-300', 'bg-white text-emerald-700 border-emerald-300', 'bg-white text-[#5D4037] border-[#D7CCC8]')}`}>
                                                                            <Icon name="x" size={12} className="inline mr-1" />
                                                                            УДАЛИТЬ
                                                                        </button>
                                                                    </div>
                                                                )}
                                                            </div>
                                                        )}

                                                        <div className="flex flex-wrap items-center justify-between mt-auto pt-2 gap-2">
                                                            <div className="flex items-center space-x-1">
                                                                <button onClick={() => clearDraftQty(item.id)} className={`w-7 h-8 sm:w-8 flex items-center justify-center rounded border ${t('bg-[#33363B] border-[#4A4E54]', 'bg-gray-200 border-gray-300 text-gray-600', 'bg-pink-100 border-pink-200 text-pink-700', 'bg-blue-100 border-blue-200 text-blue-700', 'bg-emerald-100 border-emerald-200 text-emerald-800', 'bg-[#EFEBE9] border-[#D7CCC8] text-[#5D4037]')}`}><Icon name="x" size={16}/></button>
                                                                <button onClick={() => updateDraftQty(item.id, -1)} className={`w-7 h-8 sm:w-8 flex items-center justify-center rounded border font-black text-sm ${t('bg-[#33363B] border-[#4A4E54]', 'bg-gray-200 border-gray-300 text-gray-600', 'bg-pink-100 border-pink-200 text-pink-700', 'bg-blue-100 border-blue-200 text-blue-700', 'bg-emerald-100 border-emerald-200 text-emerald-800', 'bg-[#EFEBE9] border-[#D7CCC8] text-[#5D4037]')}`}>-1</button>
                                                                
                                                                <input 
                                                                    type="number"
                                                                    min="0"
                                                                    value={draftQty}
                                                                    onChange={(e) => setAbsoluteDraftQty(item.id, e.target.value)}
                                                                    onBlur={(e) => { if (e.target.value === '') setAbsoluteDraftQty(item.id, 0); }}
                                                                    className={`w-10 h-8 sm:w-12 text-center flex items-center justify-center rounded border font-black text-[16px] sm:text-sm font-mono transition-colors focus:outline-none focus:ring-2 ${t('bg-[#121212] border-[#444] text-white focus:ring-[#FFB300]', 'bg-gray-50 border-gray-300 text-black focus:ring-amber-500', 'bg-pink-50 border-pink-300 text-pink-900 focus:ring-pink-400', 'bg-blue-50 border-blue-300 text-blue-900 focus:ring-blue-400', 'bg-emerald-50 border-emerald-300 text-emerald-950 focus:ring-emerald-400', 'bg-white border-[#D7CCC8] text-[#3E2723] focus:ring-[#8D6E63]')}`}
                                                                />
                                                                
                                                                <button onClick={() => updateDraftQty(item.id, 1)} className={`w-7 h-8 sm:w-8 flex items-center justify-center rounded border font-black text-sm ${t('bg-[#FFB300]/15 border-[#FFB300]/50 text-[#FFB300]', 'bg-amber-200 border-amber-600 text-amber-900', 'bg-pink-200 border-pink-500 text-pink-800', 'bg-blue-200 border-blue-600 text-blue-800', 'bg-emerald-200 border-emerald-600 text-emerald-900', 'bg-[#D7CCC8] border-[#8D6E63] text-[#3E2723]', 'bg-amber-100 text-amber-900 border border-amber-300 hover:bg-amber-200')}`}>+1</button>
                                                                <button onClick={() => updateDraftQty(item.id, 6)} className={`w-7 h-8 sm:w-8 flex items-center justify-center rounded border font-black text-sm ${t('bg-[#FFB300]/15 border-[#FFB300]/50 text-[#FFB300]', 'bg-amber-200 border-amber-600 text-amber-900', 'bg-pink-200 border-pink-500 text-pink-800', 'bg-blue-200 border-blue-600 text-blue-800', 'bg-emerald-200 border-emerald-600 text-emerald-900', 'bg-[#D7CCC8] border-[#8D6E63] text-[#3E2723]', 'bg-amber-100 text-amber-900 border border-amber-300 hover:bg-amber-200')}`}>+6</button>
                                                            </div>
                                                            <button 
                                                                onClick={() => addToCart(item, draftQty)}
                                                                disabled={!draftQty || draftQty <= 0}
                                                                className={`flex-grow sm:flex-grow-0 px-3 py-1.5 rounded font-black text-xs flex items-center justify-center transition-all ${
                                                                    draftQty > 0
                                                                        ? t(
                                                                            'bg-[#FFB300] text-black shadow-md shadow-[#FFB300]/20 active:scale-95',
                                                                            'bg-amber-600 text-white shadow-md shadow-amber-600/30 active:scale-95',
                                                                            'bg-pink-500 text-white shadow-md shadow-pink-500/30 active:scale-95',
                                                                            'bg-blue-600 text-white shadow-md shadow-blue-600/30 active:scale-95',
                                                                            'bg-emerald-600 text-white shadow-md shadow-emerald-600/30 active:scale-95',
                                                                            'bg-[#6D4C41] text-white shadow-md shadow-[#6D4C41]/30 active:scale-95',
                                                                            'bg-[#C62828] text-white shadow-md shadow-[#C62828]/30 hover:bg-[#B71C1C] active:scale-95'
                                                                          )
                                                                        : t(
                                                                            'bg-[#1E2125] text-gray-500 border border-gray-700 cursor-not-allowed',
                                                                            'bg-gray-200 text-gray-500 border border-gray-300 cursor-not-allowed',
                                                                            'bg-pink-100 text-pink-400 border border-pink-200 cursor-not-allowed',
                                                                            'bg-blue-100 text-blue-400 border border-blue-200 cursor-not-allowed',
                                                                            'bg-emerald-100 text-emerald-400 border border-emerald-200 cursor-not-allowed',
                                                                            'bg-[#EFEBE9] text-[#8D6E63]/60 border border-[#D7CCC8] cursor-not-allowed',
                                                                            'bg-gray-200 text-gray-500 border border-gray-300 cursor-not-allowed'
                                                                          )
                                                                }`}
                                                            >
                                                                <Icon name="plus" size={14} className="mr-1"/> ДОБАВИТЬ
                                                            </button>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            ))
                        )}
                    </div>

                    {isEditMode && !showEditModal && !showCart && !showCheckout && (
                        <button 
                            onClick={() => setIsEditMode(false)}
                            className="fixed right-4 sm:right-6 w-12 h-12 sm:w-14 sm:h-14 rounded-full flex items-center justify-center shadow-lg z-50 transition-all bg-red-600 text-white shadow-red-600/30 active:scale-95"
                            style={{ bottom: `calc(${totalDraftItems > 0 ? '160px' : '90px'} + env(safe-area-inset-bottom, 16px))` }}
                            title="Отключить режим редактирования"
                        >
                            <Icon name="pen-off" size={24} />
                        </button>
                    )}

                    {totalDraftItems > 0 && !showCart && !showCheckout && !showSettings && !showEditModal && (
                        <div 
                            className={`fixed left-4 right-4 sm:left-1/2 sm:-translate-x-1/2 sm:w-full sm:max-w-md p-3 rounded-xl sm:rounded-2xl shadow-2xl flex justify-between items-center transition-all z-50 border-2 ${t('bg-[#282B30] border-[#FFB300]', 'bg-white border-amber-600', 'bg-white border-pink-500', 'bg-white border-blue-600', 'bg-white border-emerald-600', 'bg-white border-[#8D6E63]')}`}
                            style={{ bottom: 'calc(90px + env(safe-area-inset-bottom, 16px))' }}
                        >
                            <div className="flex flex-col items-start pl-2">
                                <span className={`text-[9px] sm:text-[10px] font-black tracking-widest ${t('text-gray-400', 'text-gray-500', 'text-pink-400', 'text-blue-500', 'text-emerald-600', 'text-[#8D6E63]')}`}>ВЫБРАНО</span>
                                <span className={`text-lg sm:text-xl font-black font-mono leading-none mt-1 ${t('text-[#FFB300]', 'text-amber-900', 'text-pink-600', 'text-blue-600', 'text-emerald-700', 'text-[#5D4037]')}`}>{totalDraftItems}</span>
                            </div>
                            <button 
                                onClick={addAllDraftsToCart}
                                className={`px-4 py-3 sm:px-5 rounded-lg sm:rounded-xl text-xs sm:text-sm font-black tracking-widest shadow-lg flex items-center ${t('bg-[#FFB300] text-black', 'bg-amber-600 text-white shadow-amber-600/30', 'bg-pink-500 text-white shadow-pink-500/30', 'bg-blue-600 text-white shadow-blue-600/30', 'bg-emerald-600 text-white shadow-emerald-600/30', 'bg-[#6D4C41] text-white shadow-[#6D4C41]/30')}`}
                            >
                                <Icon name="shopping-cart" size={16} className="mr-1 sm:mr-2" />
                                ДОБАВИТЬ
                            </button>
                        </div>
                    )}

                    {showEditModal && (
                        <EditItemModal 
                            editingItem={editingItem}
                            theme={theme}
                            manufacturers={manufacturers}
                            onSave={(newItem) => {
                                if (editingItem) {
                                    setCatalog(prev => prev.map(i => i.id === editingItem.id ? newItem : i));
                                    setCustomItems(prev => prev.map(i => i.id === editingItem.id ? newItem : i));
                                    setCatalogEdits(prev => ({ ...prev, [newItem.id]: newItem }));
                                    showToast(`Товар ${newItem.id} обновлен`);
                                } else {
                                    setCatalog(prev => [...prev, newItem]);
                                    setCustomItems(prev => [...prev, newItem]);
                                    showToast(`Товар ${newItem.id} добавлен в «Мое»`);
                                }
                                setShowEditModal(false);
                                setEditingItem(null);
                            }}
                            onClose={() => { setShowEditModal(false); setEditingItem(null); }}
                        />
                    )}

                    {showCart && (
                        <div className="fixed inset-0 w-full bg-black/80 z-50 flex flex-col">
                            <div className={`p-4 flex items-center justify-between flex-shrink-0 ${t('bg-[#282B30]', 'bg-white', 'bg-pink-100', 'bg-blue-100', 'bg-emerald-100', 'bg-[#EFEBE9]')}`}>
                                <h2 className={`font-black text-base tracking-wider ${t('text-[#FFB300]', 'text-amber-900', 'text-pink-600', 'text-blue-600', 'text-emerald-700', 'text-[#5D4037]', 'text-[#9A1B24]')}`}>ЗАЯВКА НА СКЛАД</h2>
                                <div className="flex items-center space-x-2">
                                    {cart.length > 0 && (
                                        <button
                                            onClick={() => {
                                                if (confirmClearCart) {
                                                    setCart([]);
                                                    setConfirmClearCart(false);
                                                    showToast('Корзина очищена');
                                                } else {
                                                    setConfirmClearCart(true);
                                                    setTimeout(() => setConfirmClearCart(false), 3000);
                                                }
                                            }}
                                            className={`flex items-center px-2.5 py-1.5 rounded text-[10px] font-black tracking-widest transition-all ${confirmClearCart ? 'bg-red-600 text-white animate-pulse' : t('bg-[#33363B] text-gray-400 hover:text-red-400', 'bg-gray-100 text-gray-500 hover:text-red-500', 'bg-pink-100 text-pink-400 hover:text-red-500', 'bg-blue-100 text-blue-400 hover:text-red-500', 'bg-emerald-100 text-emerald-500 hover:text-red-500', 'bg-[#EFEBE9] text-[#A1887F] hover:text-red-500')}`}
                                        >
                                            <Icon name="trash-2" size={13} className="mr-1" />
                                            {confirmClearCart ? 'ТОЧНО ОЧИСТИТЬ?' : 'ОЧИСТИТЬ ВСЁ'}
                                        </button>
                                    )}
                                    <button onClick={() => { setShowCart(false); setConfirmClearCart(false); }} className="p-2"><Icon name="x" /></button>
                                </div>
                            </div>
                            
                            <div className={`px-4 py-3 flex justify-start items-center space-x-6 text-xs font-bold tracking-widest flex-shrink-0 ${t('bg-[#1E2125] text-gray-400', 'bg-gray-200 text-gray-700', 'bg-pink-200 text-pink-900', 'bg-blue-200 text-blue-900', 'bg-emerald-200 text-emerald-900', 'bg-[#D7CCC8] text-[#3E2723]')}`}>
                                <span className={`font-black ${t('text-[#FFB300]', 'text-amber-900', 'text-pink-600', 'text-blue-700', 'text-emerald-800', 'text-[#5D4037]', 'text-[#9A1B24]')}`}>ПОЗИЦИЙ: {totalCartPositions}</span>
                                <span className={`font-black ${t('text-[#FFB300]', 'text-amber-900', 'text-pink-600', 'text-blue-700', 'text-emerald-800', 'text-[#5D4037]', 'text-[#9A1B24]')}`}>ЕДИНИЦ: {totalCartUnits}</span>
                            </div>

                            <div className={`flex-1 overflow-y-auto p-3 space-y-2 ${t('bg-[#101112]', 'bg-[#F0F2F5]', 'bg-pink-50', 'bg-blue-50', 'bg-emerald-50', 'bg-[#F5F2EE]')}`} style={{ paddingBottom: '160px' }}>
                                {cart.length === 0 ? (
                                    <div className="flex flex-col items-center justify-center h-full opacity-50">
                                        <Icon name="shopping-cart" size={64} className="mb-4" />
                                        <span className="font-bold tracking-widest text-sm">ПОЗИЦИИ НЕ ВЫБРАНЫ</span>
                                    </div>
                                ) : (
                                    cart.map(c => (
                                        <div key={c.equipment.id} className={`p-3 rounded border ${t('bg-[#282B30] border-transparent', 'bg-white border-gray-300', 'bg-white border-pink-200', 'bg-white border-blue-200', 'bg-white border-emerald-200', 'bg-white border-[#D7CCC8]')}`}>
                                            <h4 className="text-[13px] leading-tight font-bold mb-0.5">{c.equipment.name}</h4>
                                            <div className={`text-[11px] font-mono font-bold mb-2.5 ${t('text-[#FFB300]', 'text-amber-900', 'text-pink-600', 'text-blue-600', 'text-emerald-700', 'text-[#6D4C41]')}`}>АРТИКУЛ: {c.equipment.id}</div>
                                            
                                            <div className="flex justify-end items-center space-x-1.5">
                                                <button onClick={() => removeFromCart(c.equipment.id)} className={`w-7 h-7 flex justify-center items-center rounded ${t('bg-[#3B3E43] text-white', 'bg-gray-200 text-gray-800 border border-gray-300 hover:bg-gray-300', 'bg-pink-200 text-pink-700', 'bg-blue-200 text-blue-800', 'bg-emerald-200 text-emerald-900', 'bg-[#D7CCC8] text-[#3E2723]', 'bg-gray-200 text-gray-800 border border-gray-300 hover:bg-gray-300')}`}><Icon name="x" size={14}/></button>
                                                <button onClick={() => updateCartQty(c.equipment.id, -1)} className={`w-7 h-7 flex justify-center items-center rounded text-[12px] font-black ${t('bg-[#3B3E43] text-white', 'bg-gray-200 text-gray-800 border border-gray-300 hover:bg-gray-300', 'bg-pink-200 text-pink-700', 'bg-blue-200 text-blue-800', 'bg-emerald-200 text-emerald-900', 'bg-[#D7CCC8] text-[#3E2723]', 'bg-gray-200 text-gray-800 border border-gray-300 hover:bg-gray-300')}`}>-1</button>
                                                <div className={`w-10 text-center font-mono font-black text-base ${t('text-white', 'text-gray-900', 'text-pink-950', 'text-blue-950', 'text-emerald-950', 'text-[#3E2723]', 'text-[#9A1B24]')}`}>{c.quantity}</div>
                                                <button onClick={() => updateCartQty(c.equipment.id, 1)} className={`w-7 h-7 flex justify-center items-center rounded text-[12px] font-black ${t('bg-[#FFB300] text-black', 'bg-amber-500 text-white', 'bg-pink-500 text-white', 'bg-blue-600 text-white', 'bg-emerald-600 text-white', 'bg-[#6D4C41] text-white', 'bg-amber-100 text-amber-900 border border-amber-300 hover:bg-amber-200')}`}>+1</button>
                                                <button onClick={() => updateCartQty(c.equipment.id, 6)} className={`w-7 h-7 flex justify-center items-center rounded text-[12px] font-black ${t('bg-[#FFB300] text-black', 'bg-amber-500 text-white', 'bg-pink-500 text-white', 'bg-blue-600 text-white', 'bg-emerald-600 text-white', 'bg-[#6D4C41] text-white', 'bg-amber-100 text-amber-900 border border-amber-300 hover:bg-amber-200')}`}>+6</button>
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>

                            {cart.length > 0 && (
                                <button 
                                    onClick={() => { setShowCart(false); setShowCheckout(true); }}
                                    className={`fixed left-4 right-4 sm:left-1/2 sm:-translate-x-1/2 sm:w-full sm:max-w-md py-4 rounded-xl text-sm font-black tracking-widest shadow-2xl border-2 z-[60] transition-all ${t('bg-[#FFB300] border-[#FFB300] text-black', 'bg-amber-600 border-amber-700 text-white', 'bg-pink-500 border-pink-600 text-white', 'bg-blue-600 border-blue-700 text-white', 'bg-emerald-600 border-emerald-700 text-white', 'bg-[#6D4C41] border-[#5D4037] text-white', 'bg-[#C62828] border-[#B71C1C] text-white hover:bg-[#B71C1C]')}`}
                                    style={{ bottom: 'calc(90px + env(safe-area-inset-bottom, 16px))' }}
                                >
                                    ПЕРЕЙТИ К ОФОРМЛЕНИЮ
                                </button>
                            )}
                        </div>
                    )}

                    {showCheckout && (
                        <div className={`absolute inset-0 w-full h-full z-50 flex flex-col ${t('bg-[#101112]', 'bg-gray-100', 'bg-pink-50', 'bg-blue-50', 'bg-emerald-50', 'bg-[#F5F2EE]')}`}>

                                    <h3 className={`text-lg font-black tracking-widest ${t('text-[#FFB300]', 'text-amber-900', 'text-pink-600', 'text-blue-600', 'text-emerald-700', 'text-[#5D4037]')}`}>МОЙ АККАУНТ</h3>
                                </div>
                                
                                <div className="space-y-4 mb-6">
                                    <div>
                                        <label className="text-xs font-bold mb-1 block opacity-70">ФИО / Имя:</label>
                                        <input type="text" className={`w-full p-2 text-[16px] sm:text-sm rounded border transition-colors ${t('bg-[#1E2125] border-gray-700 text-white', 'bg-white border-gray-300', 'bg-pink-50 border-pink-200 text-pink-900', 'bg-blue-50 border-blue-200 text-blue-900', 'bg-emerald-50 border-emerald-200 text-emerald-950', 'bg-white border-[#D7CCC8] text-[#3E2723]')}`} value={userProfile.name} onChange={e => setUserProfile({...userProfile, name: e.target.value})} placeholder="Иванов Иван" />
                                    </div>
                                    <div>
                                        <div className="flex justify-between items-center mb-1">
                                            <label className={`text-xs font-bold block ${phoneError ? 'text-red-500' : 'opacity-70'}`}>
                                                Номер телефона:
                                            </label>
                                            {isSyncing ? (
                                                <span className="text-[10px] font-bold opacity-70 animate-pulse">☁️ Проверка в базе...</span>
                                            ) : normalizePhone(userProfile.phone).length === 11 ? (
                                                <span className="text-[10px] font-bold text-emerald-500">☁️ Формат верный</span>
                                            ) : null}
                                        </div>
                                        <input
                                            type="tel"
                                            inputMode="numeric"
                                            maxLength={16}
                                            className={`w-full p-2 text-[16px] sm:text-sm font-mono rounded border transition-colors ${
                                                phoneError
                                                    ? 'border-red-500 ring-2 ring-red-500/40 bg-red-50 text-red-900'
                                                    : t('bg-[#1E2125] border-gray-700 text-white', 'bg-white border-gray-300', 'bg-pink-50 border-pink-200 text-pink-900', 'bg-blue-50 border-blue-200 text-blue-900', 'bg-emerald-50 border-emerald-200 text-emerald-950', 'bg-white border-[#D7CCC8] text-[#3E2723]')
                                            }`}
                                            value={userProfile.phone}
                                            onFocus={() => {
                                                if (!userProfile.phone) setUserProfile({ ...userProfile, phone: '+7 ' });
                                            }}
                                            onChange={e => {
                                                const formatted = formatPhoneMask(e.target.value);
                                                setUserProfile(prev => ({ ...prev, phone: formatted }));
                                                if (phoneError) setPhoneError('');
                                                if (isAuthVerified) {
                                                    setIsAuthVerified(false);
                                                    localStorage.removeItem('sklad_auth_verified');
                                                }
                                            }}
                                            onBlur={() => {
                                                const clean = normalizePhone(userProfile.phone);
                                                if (userProfile.phone === '+7 ' || clean.length <= 1) {
                                                    setUserProfile(prev => ({ ...prev, phone: '' }));
                                                    setPhoneError('');
                                                } else if (clean.length > 1 && clean.length < 11) {
                                                    setPhoneError('Введите полный номер в формате +7 ХХХ ХХХ ХХ ХХ');
                                                }
                                            }}
                                            placeholder="+7 999 000 00 00"
                                        />
                                        {phoneError && (
                                            <div className="mt-1.5 text-[11px] font-bold text-red-500 flex items-center">
                                                <Icon name="alert-triangle" size={13} className="mr-1 flex-shrink-0" />
                                                <span>{phoneError}</span>
                                            </div>
                                        )}
                                    </div>
                                    <div>
                                        <div className="flex justify-between items-center mb-1">
                                            <label className="text-xs font-bold block opacity-70">
                                                ПИН-код доступа (4 цифры):
                                            </label>
                                            {isAuthVerified && (
                                                <span className="text-[10px] font-bold text-emerald-500">🔒 Защищен</span>
                                            )}
                                        </div>
                                        <input
                                            type="password"
                                            inputMode="numeric"
                                            maxLength={4}
                                            value={userProfile.pin || ''}
                                            onChange={e => {
                                                const cleanPin = e.target.value.replace(/\D/g, '').slice(0, 4);
                                                setUserProfile(prev => ({ ...prev, pin: cleanPin }));
                                                if (isAuthVerified) {
                                                    setIsAuthVerified(false);
                                                    localStorage.removeItem('sklad_auth_verified');
                                                }
                                            }}
                                            placeholder="••••"
                                            className={`w-full p-2 text-lg font-mono font-black tracking-[0.5em] text-center rounded border transition-colors ${t('bg-[#1E2125] border-gray-700 text-white', 'bg-white border-gray-300', 'bg-pink-50 border-pink-200 text-pink-900', 'bg-blue-50 border-blue-200 text-blue-900', 'bg-emerald-50 border-emerald-200 text-emerald-950', 'bg-white border-[#D7CCC8] text-[#3E2723]')}`}
                                        />
                                        <p className="mt-1 text-[10px] opacity-60">Защищает ваш профиль от входа с других устройств.</p>
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold mb-1 block opacity-70">Адрес DPD для доставки:</label>
                                        <textarea className={`w-full p-2 text-[16px] sm:text-sm rounded border transition-colors resize-none ${t('bg-[#1E2125] border-gray-700 text-white', 'bg-white border-gray-300', 'bg-pink-50 border-pink-200 text-pink-900', 'bg-blue-50 border-blue-200 text-blue-900', 'bg-emerald-50 border-emerald-200 text-emerald-950', 'bg-white border-[#D7CCC8] text-[#3E2723]')}`} rows="3" value={userProfile.address} onChange={e => setUserProfile({...userProfile, address: e.target.value})} placeholder="г. Москва, ул. Примерная, д. 1, ПВЗ DPD"></textarea>
                                    </div>
                                </div>

                                <div className="flex flex-col space-y-2">
                                    <button 
                                        onClick={() => {
                                            const clean = normalizePhone(userProfile.phone);
                                            const cleanPin = String(userProfile.pin || '').replace(/\D/g, '');
                                            if (clean.length > 0 && clean.length !== 11) {
                                                setPhoneError('Номер должен содержать 11 цифр (+7 ХХХ ХХХ ХХ ХХ)');
                                                showToast('Проверьте правильность номера телефона');
                                                return;
                                            }
                                            if (cleanPin.length > 0 && cleanPin.length !== 4) {
                                                showToast('ПИН-код должен содержать ровно 4 цифры');
                                                return;
                                            }
                                            setPhoneError('');
                                            syncToCloud(null, false);
                                            showToast('Данные аккаунта сохранены');
                                            setShowProfile(false);
                                        }} 
                                        disabled={isSyncing}
                                        className={`px-5 py-3 w-full text-sm font-black tracking-widest rounded flex items-center justify-center transition-all ${isSyncing ? 'opacity-70 cursor-not-allowed' : ''} ${t('bg-[#FFB300] text-black', 'bg-amber-600 text-white shadow-amber-600/30', 'bg-pink-500 text-white shadow-pink-500/30', 'bg-blue-600 text-white shadow-blue-600/30', 'bg-emerald-600 text-white shadow-emerald-600/30', 'bg-[#6D4C41] text-white shadow-[#6D4C41]/30', 'bg-[#C62828] text-white shadow-[#C62828]/30 hover:bg-[#B71C1C]')}`}
                                    >
                                        {isSyncing ? 'СОХРАНЕНИЕ...' : 'СОХРАНИТЬ ДАННЫЕ'}
                                    </button>
                                    <button
                                        onClick={() => {
                                            setUserProfile(prev => ({ ...prev, phone: '', pin: '' }));
                                            setIsAuthVerified(false);
                                            localStorage.removeItem('sklad_auth_verified');
                                            lastCheckedPhoneRef.current = '';
                                            setShowProfile(false);
                                            setAuthError('');
                                            setShowAuthModal(true);
                                        }}
                                        className="w-full py-2 text-xs font-bold text-red-500 hover:text-red-400 hover:bg-red-500/10 rounded transition-colors flex items-center justify-center space-x-1"
                                    >
                                        <Icon name="log-out" size={14} className="mr-1" />
                                        <span>🚪 СМЕНИТЬ АККАУНТ / ВЫЙТИ</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showHistoryModal && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                            <div className={`w-full max-w-md rounded-xl border-2 ${t('bg-[#282B30] border-[#FFB300]', 'bg-white border-amber-900', 'bg-white border-pink-400', 'bg-white border-blue-600', 'bg-white border-emerald-600', 'bg-[#FDFBF7] border-[#8D6E63]', 'bg-white border-[#C62828]')} p-5 shadow-2xl flex flex-col max-h-[90vh]`}>
                                <div className="flex items-center justify-between mb-4 flex-shrink-0">
                                    <div className="flex items-center space-x-2.5">
                                        <button onClick={() => { setShowHistoryModal(false); setShowSettings(true); }} className={`p-1.5 rounded-full transition-colors ${t('hover:bg-gray-700', 'hover:bg-gray-200', 'hover:bg-pink-100', 'hover:bg-blue-100', 'hover:bg-emerald-100', 'hover:bg-[#D7CCC8]', 'hover:bg-red-50')}`}>
                                            <Icon name="arrow-left" size={20} className={t('text-[#FFB300]', 'text-amber-900', 'text-pink-600', 'text-blue-600', 'text-emerald-700', 'text-[#5D4037]', 'text-[#9A1B24]')} />
                                        </button>
                                        <h3 className={`text-base font-black tracking-widest ${t('text-[#FFB300]', 'text-amber-900', 'text-pink-600', 'text-blue-600', 'text-emerald-700', 'text-[#5D4037]', 'text-[#9A1B24]')}`}>ИСТОРИЯ ЗАКАЗОВ</h3>
                                    </div>
                                    <button onClick={() => setShowHistoryModal(false)} className="p-1.5 opacity-70 hover:opacity-100">
                                        <Icon name="x" size={20} />
                                    </button>
                                </div>

                                <div className="flex-1 overflow-y-auto space-y-3 pr-1 hide-scrollbar">
                                    {orderHistory.length === 0 ? (
                                        <div className="flex flex-col items-center justify-center py-12 text-center opacity-50">
                                            <Icon name="history" size={48} className="mb-3" />
                                            <span className="font-bold text-sm tracking-wide">История заказов пуста</span>
                                        </div>
                                    ) : (
                                        orderHistory.map((order, idx) => {
                                            const orderNum = order.orderNumber || (orderHistory.length - idx);
                                            const isConfirming = confirmDeleteOrderId === order.id;
                                            return (
                                                <div key={order.id} className={`p-3.5 rounded-lg border flex flex-col space-y-2.5 ${t('bg-[#1E2125] border-gray-700', 'bg-gray-50 border-gray-200', 'bg-pink-50 border-pink-200', 'bg-blue-50 border-blue-200', 'bg-emerald-50 border-emerald-200', 'bg-white border-[#D7CCC8]', 'bg-[#F9FAFB] border-gray-200')}`}>
                                                    <div className="flex justify-between items-start text-xs">
                                                        <div className={`font-black text-sm tracking-wide ${t('text-[#FFB300]', 'text-amber-900', 'text-pink-600', 'text-blue-700', 'text-emerald-800', 'text-[#5D4037]', 'text-[#9A1B24]')}`}>
                                                            ЗАКАЗ №{orderNum}
                                                        </div>
                                                        <div className="flex items-center space-x-2">
                                                            <span className="text-[11px] opacity-60 font-mono">{order.date}</span>
                                                            {order.deliveryMethod && (
                                                                <span className={`px-2 py-0.5 rounded text-[9px] font-black tracking-widest ${t('bg-[#33363B] text-[#FFB300]', 'bg-amber-100 text-amber-800', 'bg-pink-200 text-pink-800', 'bg-blue-200 text-blue-800', 'bg-emerald-200 text-emerald-900', 'bg-[#D7CCC8] text-[#3E2723]', 'bg-red-100 text-[#9A1B24]')}`}>
                                                                    {order.deliveryMethod.toUpperCase()}
                                                                </span>
                                                            )}
                                                        </div>
                                                    </div>

                                                    <div className="text-[11px] opacity-80 space-y-0.5 font-mono max-h-28 overflow-y-auto pr-1">
                                                        {(order.items || []).map((it, i) => {
                                                            const id = it.equipment ? it.equipment.id : it.id;
                                                            const name = it.equipment ? it.equipment.name : it.name;
                                                            return (
                                                                <div key={i} className="truncate">
                                                                    {id} — {name} × {it.quantity} шт.
                                                                </div>
                                                            );
                                                        })}
                                                    </div>

                                                    <div className="flex items-center justify-end space-x-2 pt-1 border-t border-gray-500/20">
                                                        <button
                                                            onClick={() => {
                                                                if (isConfirming) {
                                                                    setOrderHistory(prev => prev.filter(o => o.id !== order.id));
                                                                    setConfirmDeleteOrderId(null);
                                                                    showToast('Заказ удален из истории');
                                                                } else {
                                                                    setConfirmDeleteOrderId(order.id);
                                                                    setTimeout(() => setConfirmDeleteOrderId(null), 3000);
                                                                }
                                                            }}
                                                            className={`px-2.5 py-1.5 rounded text-xs font-bold flex items-center transition-all ${isConfirming ? 'bg-red-600 text-white animate-pulse' : 'text-red-500 hover:bg-red-500/10'}`}
                                                            title="Удалить заказ"
                                                        >
                                                            <Icon name="trash-2" size={14} className="mr-1" />
                                                            <span>{isConfirming ? 'ТОЧНО?' : 'УДАЛИТЬ'}</span>
                                                        </button>

                                                        <button
                                                            onClick={() => {
                                                                setCart(JSON.parse(JSON.stringify(order.items || [])));
                                                                setShowHistoryModal(false);
                                                                setShowCart(true);
                                                                showToast(`Заказ №${orderNum} загружен в корзину`);
                                                            }}
                                                            className={`px-3 py-1.5 rounded text-xs font-black tracking-wider flex items-center shadow transition-all active:scale-95 ${t('bg-[#FFB300] text-black hover:bg-[#FFA000]', 'bg-amber-600 text-white hover:bg-amber-700', 'bg-pink-500 text-white hover:bg-pink-600', 'bg-blue-600 text-white hover:bg-blue-700', 'bg-emerald-600 text-white hover:bg-emerald-700', 'bg-[#6D4C41] text-white hover:bg-[#5D4037]', 'bg-[#C62828] text-white hover:bg-[#B71C1C]')}`}
                                                        >
                                                            <Icon name="rotate-ccw" size={13} className="mr-1.5" />
                                                            <span>ПОВТОРИТЬ ЗАКАЗ</span>
                                                        </button>
                                                    </div>
                                                </div>
                                            );
                                        })
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {showAuthModal && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[80] flex items-center justify-center p-4">
                            <div className={`w-full max-w-sm rounded-xl border-2 ${t('bg-[#282B30] border-[#FFB300]', 'bg-white border-amber-900', 'bg-white border-pink-400', 'bg-white border-blue-600', 'bg-white border-emerald-600', 'bg-[#FDFBF7] border-[#8D6E63]', 'bg-white border-[#C62828]')} p-6 shadow-2xl`}>
                                <div className="flex items-center space-x-2.5 mb-2">
                                    <Icon name="shield-check" size={24} className={t('text-[#FFB300]', 'text-amber-600', 'text-pink-500', 'text-blue-600', 'text-emerald-600', 'text-[#8D6E63]', 'text-[#C62828]')} />
                                    <h3 className={`text-lg font-black tracking-widest ${t('text-[#FFB300]', 'text-amber-900', 'text-pink-600', 'text-blue-600', 'text-emerald-700', 'text-[#5D4037]', 'text-[#9A1B24]')}`}>
                                        АВТОРИЗАЦИЯ
                                    </h3>
                                </div>

                                <p className="text-xs font-bold opacity-75 mb-4">
                                    Введите номер телефона и 4-значный ПИН-код для доступа к данным:
                                </p>

                                <div className="space-y-3.5 mb-5">
                                    <div>
                                        <label className="text-[11px] font-bold block opacity-70 mb-1">Номер телефона:</label>
                                        <input
                                            type="tel"
                                            inputMode="numeric"
                                            autoFocus
                                            maxLength={16}
                                            value={userProfile.phone}
                                            onFocus={() => {
                                                if (!userProfile.phone) setUserProfile(prev => ({ ...prev, phone: '+7 ' }));
                                            }}
                                            onChange={e => {
                                                const formatted = formatPhoneMask(e.target.value);
                                                setUserProfile(prev => ({ ...prev, phone: formatted }));
                                                if (authError) setAuthError('');
                                            }}
                                            placeholder="+7 999 000 00 00"
                                            className={`w-full p-2.5 text-base font-mono font-bold text-center tracking-wider rounded-lg border-2 outline-none transition-all ${
                                                authError
                                                    ? 'border-red-500 bg-red-50 text-red-900'
                                                    : t('bg-[#1E2125] border-gray-700 text-white focus:border-[#FFB300]', 'bg-gray-50 border-gray-300 text-gray-900 focus:border-amber-600', 'bg-pink-50 border-pink-200 text-pink-900', 'bg-blue-50 border-blue-200 text-blue-900', 'bg-emerald-50 border-emerald-200 text-emerald-950', 'bg-white border-[#D7CCC8] text-[#3E2723]', 'bg-gray-50 border-gray-300 text-gray-900 focus:border-[#C62828]')
                                            }`}
                                        />
                                    </div>

                                    <div>
                                        <label className="text-[11px] font-bold block opacity-70 mb-1">ПИН-код (4 цифры):</label>
                                        <input
                                            type="password"
                                            inputMode="numeric"
                                            maxLength={4}
                                            value={userProfile.pin || ''}
                                            onChange={e => {
                                                const cleanPin = e.target.value.replace(/\D/g, '').slice(0, 4);
                                                setUserProfile(prev => ({ ...prev, pin: cleanPin }));
                                                if (authError) setAuthError('');
                                            }}
                                            placeholder="••••"
                                            className={`w-full p-2.5 text-xl font-mono font-black text-center tracking-[0.5em] rounded-lg border-2 outline-none transition-all ${
                                                authError
                                                    ? 'border-red-500 bg-red-50 text-red-900'
                                                    : t('bg-[#1E2125] border-gray-700 text-white focus:border-[#FFB300]', 'bg-gray-50 border-gray-300 text-gray-900 focus:border-amber-600', 'bg-pink-50 border-pink-200 text-pink-900', 'bg-blue-50 border-blue-200 text-blue-900', 'bg-emerald-50 border-emerald-200 text-emerald-950', 'bg-white border-[#D7CCC8] text-[#3E2723]', 'bg-gray-50 border-gray-300 text-gray-900 focus:border-[#C62828]')
                                            }`}
                                        />
                                        <p className="mt-1 text-[10px] opacity-60">Если входите впервые — придумайте любой 4-значный ПИН-код и запомните его.</p>
                                    </div>

                                    {authError && (
                                        <div className="p-2.5 rounded-lg bg-red-500/15 border border-red-500/50 text-[11px] font-bold text-red-500 flex items-start space-x-1.5">
                                            <Icon name="alert-triangle" size={14} className="mr-1 flex-shrink-0 mt-0.5" />
                                            <span>{authError}</span>
                                        </div>
                                    )}

                                    {isSyncing && (
                                        <div className="text-[11px] font-bold opacity-70 text-center animate-pulse">
                                            ☁️ Проверка авторизации в облаке...
                                        </div>
                                    )}
                                </div>

                                <button
                                    onClick={() => {
                                        const clean = normalizePhone(userProfile.phone);
                                        const cleanPin = String(userProfile.pin || '').replace(/\D/g, '');
                                        if (clean.length !== 11) {
                                            setAuthError('Введите полный номер в формате +7 ХХХ ХХХ ХХ ХХ');
                                            return;
                                        }
                                        if (cleanPin.length !== 4) {
                                            setAuthError('Введите 4-значный ПИН-код');
                                            return;
                                        }
                                        setAuthError('');
                                        loadFromCloud(userProfile.phone, userProfile.pin, false);
                                    }}
                                    disabled={isSyncing}
                                    className={`w-full py-3.5 rounded-lg text-xs font-black tracking-widest shadow-lg transition-all active:scale-95 ${isSyncing ? 'opacity-70 cursor-not-allowed' : ''} ${t('bg-[#FFB300] text-black', 'bg-amber-600 text-white', 'bg-pink-500 text-white', 'bg-blue-600 text-white', 'bg-emerald-600 text-white', 'bg-[#6D4C41] text-white', 'bg-[#C62828] text-white hover:bg-[#B71C1C]')}`}
                                >
                                    {isSyncing ? 'ПРОВЕРКА...' : 'ВОЙТИ В ПРИЛОЖЕНИЕ'}
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
